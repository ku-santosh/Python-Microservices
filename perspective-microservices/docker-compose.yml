version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: your_db_user
      POSTGRES_PASSWORD: your_db_password
      POSTGRES_DB: skg023
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - appnet

  db-proxy:
    build: ./db-proxy
    container_name: db-proxy
    restart: always
    environment:
      DB_NAME: skg023
      DB_SCHEMA: recsui
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: your_db_user
      DB_PASSWORD: your_db_password
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - appnet

  perspective-service:
    build: ./perspective-service
    container_name: perspective-service
    restart: always
    environment:
      DB_PROXY_HOST: db-proxy
      DB_PROXY_PORT: 5000
    ports:
      - "5001:5001"
    depends_on:
      - db-proxy
    networks:
      - appnet

  columnstate-service:
    build: ./columnstate-service
    container_name: columnstate-service
    restart: always
    environment:
      DB_PROXY_HOST: db-proxy
      DB_PROXY_PORT: 5000
    ports:
      - "5002:5002"
    depends_on:
      - db-proxy
    networks:
      - appnet

  filtermodel-service:
    build: ./filtermodel-service
    container_name: filtermodel-service
    restart: always
    environment:
      DB_PROXY_HOST: db-proxy
      DB_PROXY_PORT: 5000
    ports:
      - "5003:5003"
    depends_on:
      - db-proxy
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge

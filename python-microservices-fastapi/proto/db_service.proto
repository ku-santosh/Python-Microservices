syntax = "proto3";
package dbservice;

message Empty {}
message Pong { string message = 1; }

service DBService {
  rpc Ping(Empty) returns (Pong);

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserByUsername(GetUserRequest) returns (GetUserResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc ListProducts(Empty) returns (ListProductsResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message CreateUserRequest { string username = 1; string password_hash = 2; }
message CreateUserResponse { int64 id = 1; string error = 2; }
message GetUserRequest { string username = 1; }
message GetUserResponse { int64 id = 1; string username = 2; string password_hash = 3; string error = 4; }

message CreateProductRequest { string name = 1; double price = 2; }
message CreateProductResponse { int64 id = 1; string error = 2; }
message ListProductsResponse { repeated Product products = 1; }
message Product { int64 id = 1; string name = 2; double price = 3; }

message CreateOrderRequest { int64 user_id = 1; int64 product_id = 2; int32 quantity = 3; }
message CreateOrderResponse { int64 id = 1; string error = 2; }
message ListOrdersRequest { int64 user_id = 1; }
message ListOrdersResponse { repeated Order orders = 1; }
message Order { int64 id = 1; int64 user_id = 2; int64 product_id = 3; int32 quantity = 4; string status = 5; }

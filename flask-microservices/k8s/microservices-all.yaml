apiVersion: v1
kind: Namespace
metadata:
  name: microservices

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: microservices
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "microservices_db"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata
      volumes:
        - name: pgdata
          emptyDir: {{}}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: microservices
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: your-registry/microservices-auth:latest
          env:
            - name: STAGE
              value: "prod"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/microservices_db"
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: microservices
spec:
  selector:
    app: auth
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
        - name: products
          image: your-registry/microservices-products:latest
          env:
            - name: STAGE
              value: "prod"
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: products
  namespace: microservices
spec:
  selector:
    app: products
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: your-registry/microservices-orders:latest
          env:
            - name: STAGE
              value: "prod"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/microservices_db"
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: microservices
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: products
                port:
                  number: 80
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 80

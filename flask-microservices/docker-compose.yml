version: "3.8"

services:
  postgres:
    image: postgres:14
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  traefik:
    image: traefik:v2.10
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  auth:
    build: ./services/auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"        ports:
      - "5001:5000"
    env_file:
      - .env.${STAGE}
    environment:
      - STAGE=${STAGE}
      - DATABASE_URL=${DATABASE_URL}

  products:
    build: ./services/products
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.products.rule=PathPrefix(`/products`)"        ports:
      - "5002:5000"
    env_file:
      - .env.${STAGE}
    environment:
      - STAGE=${STAGE}

  orders:
    build: ./services/orders
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orders.rule=PathPrefix(`/orders`)"        ports:
      - "5003:5000"
    env_file:
      - .env.${STAGE}
    environment:
      - STAGE=${STAGE}
      - DATABASE_URL=${DATABASE_URL}

volumes:
  pgdata:
